name: NPM Build

env:
  DOCKER_DIRECTORY: "${{ github.workspace }}"
  DOCKER_CONTAINER: "neuroviewer-app"
  DOCKER_IMAGE: "nginx:stable-alpine"

on:
  repository_dispatch:
    types: [test_workflow]
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:

  package_neuroconnect:
      runs-on: self-hosted
      if: github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v2
        - name: Package neuroconnect
          if: always()
          run: |
            cd ./neuroviewer
            npm install
            sed -i 's/<DRIVE_API_KEY>/${{ secrets.DRIVE_API_KEY }}/g' config/api-keys.env.js
            sed -i 's/<DRIVE_CLIENT_ID>/${{ secrets.DRIVE_CLIENT_ID }}/g' config/api-keys.env.js
            CI=false npm run build

        - name: scp build files to main host
          uses: appleboy/scp-action@master
          if: always()
          with:
            host: ${{ secrets.MAIN_HOST }}
            username: ${{ secrets.USERNAME }}
            password: ${{ secrets.PASSWORD }}
            source: "neuroviewer/dist,neuroviewer/Dockerfile,neuroviewer/default.conf"            
            target: "$${{ secrets.BASE_DIR }}/temp/neuroviewer"
            strip_components: 1            
            rm: true

  deploy_neuroconnect:
    runs-on: self-hosted
    needs: package_neuroconnect
    if: github.ref == 'refs/heads/main'
    steps:
      - name: executing remote ssh commands to relaunch Docker and deploy to main server
        uses: appleboy/ssh-action@master
        if: always()
        with:
          host: ${{ secrets.MAIN_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            sudo docker container stop ${{ env.DOCKER_CONTAINER }}
            sudo docker container rm ${{ env.DOCKER_CONTAINER }}
            sudo docker system prune -a -f
            sudo docker build -t ${{ env.DOCKER_IMAGE }} $${{ secrets.BASE_DIR }}/temp/neuroviewer/
            sudo docker run -dit --name ${{ env.DOCKER_CONTAINER }} -p 3602:3602 -e TZ=America/Los_Angeles -v /src/neuroviewer-app:/app --restart=always ${{ env.DOCKER_IMAGE }}
            # sudo docker container ls -a

  slack:
    runs-on: ubuntu-latest
    needs: deploy_neuroconnect
    steps:
      - uses: craftech-io/slack-action@v1
        with:
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
